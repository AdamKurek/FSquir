name: dotnet

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore core tests
        run: dotnet restore tests/tests.csproj

      - name: Restore API tests
        run: dotnet restore FSquir.Api.Tests/FSquir.Api.Tests.csproj

      - name: Test core
        run: dotnet test tests/tests.csproj --no-restore --configuration Debug

      - name: Test API
        run: dotnet test FSquir.Api.Tests/FSquir.Api.Tests.csproj --no-restore --configuration Debug

      - name: Build API
        run: dotnet build FSquir.Api/FSquir.Api.csproj --no-restore --configuration Debug
